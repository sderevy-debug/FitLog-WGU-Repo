<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In - FitLog</title>
  {% load static %}
    <link rel="stylesheet" href="{% static '/css/styles.css' %}">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-logo">Fit<span>Log.</span></div>
    <p class="login-sub">Track your training. Own your progress.</p>

    <div class="card">
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          {% if form.errors %}
            <p class="form-error">Invalid username or password.</p>
          {% endif %}
        </div>

        <button type="submit" class="btn btn--primary">Log In</button>
      </form>

      <p class="form-footer" style="margin-top:0.75rem;">
        <a href="{% url 'password_reset' %}">Forgot password?</a>
      </p>
      <p class="form-footer">
        No account? <a href="{% url 'account_register' %}">Sign up</a>
      </p>
    </div>
  </div>
</body>
</html>
