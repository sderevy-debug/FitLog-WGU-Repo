<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <title>Reset Password — FitLog</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-logo">Fit<span>Log.</span></div>
    <p class="login-sub">Enter your new password.</p>
    <div class="card">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="new_password1" required />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="new_password2" required />
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;">Set Password</button>
      </form>
    </div>
  </div>
</body>
</html>
