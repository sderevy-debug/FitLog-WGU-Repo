<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password — FitLog</title>
  {% load static %}
  <link rel="stylesheet" href="{% static '/css/styles.css' %}" />
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-logo">Fit<span>Log.</span></div>
    <p class="login-sub">Enter your new password.</p>
    <div class="card">

     {% if validlink %}
          <form method="post">
            {% csrf_token %}

            <div class="form-group">
              <label>New Password</label>
              {{ form.new_password1 }}
              {{ form.new_password1.errors }}
            </div>

            <div class="form-group">
              <label>Confirm Password</label>
              {{ form.new_password2 }}
              {{ form.new_password2.errors }}
            </div>

            <button type="submit" class="btn btn--primary" style="width:100%;">Set Password</button>
          </form>
        {% else %}
          <p>This link is invalid or expired. <a href="{% url 'password_reset' %}">Request a new one.</a></p>
        {% endif %}

    </div>
  </div>
</body>
</html>
